name: Deploy to GitHub Pages + Intelligence Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JS syntax — index inline + all hooks (hard fail)
        run: |
          set -euo pipefail
          echo "🧠 Syntax validation gate (index + hooks)..."
          # Extract and check inline script from index.html
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m || !m[1] || m[1].trim().length < 100) {
              console.error("❌ No substantial inline <script> found in index.html");
              process.exit(1);
            }
            fs.writeFileSync("/tmp/vr-inline.js", m[1].trim());
            console.log("✅ Inline script extracted, length:", m[1].trim().length);
          '
          node --check /tmp/vr-inline.js
          echo "✅ index.html inline script syntax PASSED"

          for hook in hooks/*.js; do
            echo "Checking $hook ..."
            node --check "$hook"
            size=$(wc -c < "$hook")
            if [ "$size" -lt 500 ]; then
              echo "❌ $hook too small ($size bytes) — possible empty/placeholder"
              exit 1
            fi
            if grep -qE "PLACEHOLDER_WILL_BE_REPLACED|TODO_REPLACE|EMPTY_HOOK" "$hook" 2>/dev/null; then
              echo "❌ $hook contains placeholder text — intelligence regression"
              exit 1
            fi
            echo "✅ $hook OK ($size bytes)"
          done
          echo "✅ All syntax gates passed"

      - name: Size + presence baselines (stricter for expanded + improved feature set)
        run: |
          set -euo pipefail
          echo "🧠 Size & presence intelligence scan..."
          expected=("error-mitigation-hook.js" "state-management-hook.js" "spawn-intelligence-hook.js" "tablet-ui-hook.js")
          for e in "${expected[@]}"; do
            if [ ! -f "hooks/$e" ]; then
              echo "❌ Missing required intelligence hook: $e"
              exit 1
            fi
          done

          size_state=$(wc -c < hooks/state-management-hook.js)
          size_tablet=$(wc -c < hooks/tablet-ui-hook.js)
          size_spawn=$(wc -c < hooks/spawn-intelligence-hook.js)
          if [ "$size_state" -lt 18000 ]; then
            echo "❌ state-management-hook.js smaller than expected for robust materials/persist/export/GLTF-mesh/share/adjust ($size_state)"
            exit 1
          fi
          if [ "$size_tablet" -lt 14000 ]; then
            echo "❌ tablet-ui-hook.js smaller than expected for 5 tools + 13 actions + holographic ($size_tablet)"
            exit 1
          fi
          if [ "$size_spawn" -lt 5000 ]; then
            echo "❌ spawn-intelligence-hook.js smaller than expected ($size_spawn)"
            exit 1
          fi
          echo "✅ Size baselines passed (state $size_state, tablet $size_tablet, spawn $size_spawn)"

      - name: Feature intelligence scan (critical exports + patterns + improved GLTF/share)
        run: |
          set -euo pipefail
          echo "🧠 Feature presence scan..."
          CRITICAL_FEATS=(
            "VRCreatorState"
            "safeExecute"
            "spawnIntelligentObject"
            "initTabletUI"
            "clearAllSpawned"
            "setSelectedColor"
            "setMaterialPreset"
            "saveSceneToStorage"
            "loadSceneFromStorage"
            "exportSceneJSON"
            "exportSceneGLTF"
            "makeWristHolographic"
            "deleteSpawnedObject"
            "shareSceneViaHash"
            "loadSceneFromHash"
            "toggleHolographic"
            "adjustMaterial"
            "applyMaterialToLast"
            "toBase64"
            "vrc="
          )
          FAIL=0
          for feat in "${CRITICAL_FEATS[@]}"; do
            if grep -q "$feat" hooks/*.js index.html 2>/dev/null; then
              echo "✅ $feat present"
            else
              echo "❌ $feat NOT found — intelligence regression"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "❌ Feature scan failed"
            exit 1
          fi
          echo "✅ All critical features present (incl improved GLTF mesh + url-safe share)"

      - name: Index.html cross-check (hooks load order + boot + avatar polish)
        run: |
          set -euo pipefail
          echo "🧠 Index cross-check..."
          for hookfile in error-mitigation-hook.js state-management-hook.js spawn-intelligence-hook.js tablet-ui-hook.js; do
            if grep -q "hooks/$hookfile" index.html; then
              echo "✅ index.html references hooks/$hookfile"
            else
              echo "❌ index.html missing script src for $hookfile"
              exit 1
            fi
          done
          for feat in "initTabletUI" "makeWristHolographic" "stats" "loadSceneFromHash" "model-loaded" "opacity = 0.55"; do
            if grep -q "$feat" index.html; then
              echo "✅ index.html uses $feat"
            else
              echo "⚠️ index.html may lack $feat (advisory)"
            fi
          done
          # Confirm load order: error before state before spawn before tablet
          ERROR_POS=$(grep -n "error-mitigation-hook.js" index.html | head -1 | cut -d: -f1)
          STATE_POS=$(grep -n "state-management-hook.js" index.html | head -1 | cut -d: -f1)
          SPAWN_POS=$(grep -n "spawn-intelligence-hook.js" index.html | head -1 | cut -d: -f1)
          TABLET_POS=$(grep -n "tablet-ui-hook.js" index.html | head -1 | cut -d: -f1)
          if [ "$ERROR_POS" -lt "$STATE_POS" ] && [ "$STATE_POS" -lt "$SPAWN_POS" ] && [ "$SPAWN_POS" -lt "$TABLET_POS" ]; then
            echo "✅ Hook load order correct (error → state → spawn → tablet)"
          else
            echo "❌ Hook load order incorrect — dependencies risk"
            exit 1
          fi

      - name: Docs-desync advisory + overclaim detection (TODO accuracy) + scripts presence
        run: |
          echo "🧠 Docs advisory + overclaim detection + scripts..."
          OVERCLAIM=0
          if [ -f TODO.md ]; then
            if grep -qE "\[x\].*[Oo]bject scale live controls|\[x\].*selectedScale|\[x\].*adjustScale" TODO.md 2>/dev/null; then
              if ! grep -qE "selectedScale|adjustScale" hooks/*.js index.html 2>/dev/null; then
                echo "❌ TODO.md marks Object scale as complete but symbols missing — docs desync"
                OVERCLAIM=1
              fi
            fi
            if grep -qE "\[x\].*[Oo]bject rotation live controls|\[x\].*selectedRotation|\[x\].*adjustRotation" TODO.md 2>/dev/null; then
              if ! grep -qE "selectedRotation|adjustRotation" hooks/*.js index.html 2>/dev/null; then
                echo "❌ TODO.md marks Object rotation as complete but symbols missing — docs desync"
                OVERCLAIM=1
              fi
            fi
            if grep -qE "\[x\].*[Pp]article feedback|\[x\].*emissive pulse|\[x\].*glow on spawn" TODO.md 2>/dev/null; then
              if ! grep -qE "emissiveIntensity|particle|pulse.*spawn|flash.*delete" hooks/*.js index.html 2>/dev/null; then
                echo "❌ TODO.md marks Particle/glow as complete but no evidence — docs desync"
                OVERCLAIM=1
              fi
            fi
            if grep -qE "\[x\].*[Ff]ull bidirectional material panel O|\[x\].*O± buttons on tablet|\[x\].*taller consistent 5-row" TODO.md 2>/dev/null; then
              if ! grep -qE "action-oplus|O\+|action-ominus" hooks/tablet-ui-hook.js 2>/dev/null; then
                echo "⚠️ TODO claims full O± panel but buttons not fully wired (handlers exist)"
              fi
            fi
            if grep -qE "\[x\].*GLTF|\[x\].*hash share|\[x\].*live material adjust" TODO.md 2>/dev/null; then
              if ! grep -q "exportSceneGLTF\|shareSceneViaHash\|adjustMaterial\|toBase64\|vrc=" hooks/*.js 2>/dev/null; then
                echo "❌ TODO claims GLTF/share/adjust complete but core missing — docs desync"
                OVERCLAIM=1
              fi
            fi
            if [ $OVERCLAIM -ne 0 ]; then
              echo "❌ Docs overclaim detected — correct TODO.md. Gate protects against repeating 2026-08 desyncs."
              # Soft for now; can harden to exit 1 later
            else
              echo "✅ No hard overclaims in TODO vs code"
            fi
          fi
          if [ ! -s index.html ] || [ ! -s hooks/state-management-hook.js ] || [ ! -s hooks/tablet-ui-hook.js ]; then
            echo "❌ Critical file is empty — abort"
            exit 1
          fi
          if [ -f scripts/validate-hooks.sh ]; then
            echo "✅ Local validate-hooks.sh present for pre-push intelligence"
          else
            echo "⚠️ scripts/validate-hooks.sh missing — recommend adding for local error reduction"
          fi
          echo "✅ Docs advisory + non-empty checks passed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-validation intelligence report
        run: |
          echo "🚀 Deploy complete. Quest VR Creator intelligence stack validated."
          echo "Features: 5 primitives, materials (5 presets + live M/R/O adjust via keys/handlers), persist, JSON+improved-GLTF export (with mesh), URL-safe hash share, holographic wrist + toggle, double-grip delete, reactive tablet (13+ actions), avatar hands polish."
          echo "Follow Local Development Workflow from skill for future changes. Docs must match code. Overclaim detection now active."
          echo "Everything done with Grok using automations — less errors, more intelligence."
