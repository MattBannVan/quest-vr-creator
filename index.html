<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quest VR Creator — Intelligent Object Creation for Meta Quest 3</title>
  <meta name="description" content="A-Frame immersive VR creation experience with physics, super-hands, materials, persist, export, holographic tablet. Built with Grok automations.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-super-hands-component@master/dist/super-hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/event-set/dist/aframe-event-set-component.min.js"></script>
  <!-- Intelligence hooks: dependency order critical (error → state → spawn → tablet) -->
  <script src="hooks/error-mitigation-hook.js"></script>
  <script src="hooks/state-management-hook.js"></script>
  <script src="hooks/spawn-intelligence-hook.js"></script>
  <script src="hooks/tablet-ui-hook.js"></script>
</head>
<body>
  <a-scene
    physics="driver: local; debug: false; gravity: -9.8"
    background="color: #0a0a1a"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
    stats
    vr-mode-ui="enabled: true"
    device-orientation-permission-ui="enabled: true"
  >
    <!-- Lighting optimized for Quest standalone -->
    <a-entity light="type: ambient; color: #445566; intensity: 0.55"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.75; castShadow: true" position="2 5 1"></a-entity>
    <a-entity light="type: point; color: #00E5FF; intensity: 0.35; distance: 12" position="0 2.5 -1"></a-entity>

    <!-- Ground + subtle grid -->
    <a-plane
      id="ground"
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#111122"
      static-body
      material="shader: flat; roughness: 0.9"
      class="raycaster-target"
    ></a-plane>
    <a-entity
      geometry="primitive: plane; width: 30; height: 30"
      material="shader: flat; color: #1a1a2e; opacity: 0.4; transparent: true; wireframe: true"
      position="0 0.01 0"
      rotation="-90 0 0"
    ></a-entity>

    <!-- Sample physics objects for initial interaction -->
    <a-box position="-1.2 0.6 -2.5" color="#EF2D5E" dynamic-body class="raycaster-target" material="metalness: 0.2; roughness: 0.6"></a-box>
    <a-sphere position="0 0.8 -2.8" radius="0.45" color="#4CC3D9" dynamic-body="shape: sphere" class="raycaster-target" material="metalness: 0.4; roughness: 0.5"></a-sphere>
    <a-cylinder position="1.3 0.5 -2.4" radius="0.3" height="0.7" color="#7BC8A4" dynamic-body="shape: cylinder" class="raycaster-target" material="metalness: 0.1; roughness: 0.7"></a-cylinder>

    <!-- Player rig: dual controllers + camera + super-hands -->
    <a-entity id="player-rig" position="0 0 0">
      <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor
          fuse="false"
          raycaster="objects: .raycaster-target; far: 8"
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
          material="color: #00E5FF; shader: flat; opacity: 0.8"
          position="0 0 -0.5"
        ></a-cursor>
      </a-entity>

      <!-- Left hand / controller -->
      <a-entity
        id="leftHand"
        hand-controls="hand: left; handModelStyle: lowPoly; color: #cccccc"
        oculus-touch-controls="hand: left"
        super-hands
        sphere-collider="objects: .raycaster-target"
        raycaster="objects: .raycaster-target; far: 6; showLine: true; lineColor: #00E5FF; lineOpacity: 0.4"
        line="color: #00E5FF; opacity: 0.35"
        position="-0.3 1.4 -0.4"
      ></a-entity>

      <!-- Right hand / controller + grip-delete + double-grip -->
      <a-entity
        id="rightHand"
        hand-controls="hand: right; handModelStyle: lowPoly; color: #cccccc"
        oculus-touch-controls="hand: right"
        super-hands
        sphere-collider="objects: .raycaster-target"
        raycaster="objects: .raycaster-target; far: 6; showLine: true; lineColor: #FF9F1C; lineOpacity: 0.45"
        line="color: #FF9F1C; opacity: 0.4"
        position="0.3 1.4 -0.4"
      ></a-entity>
    </a-entity>

    <!-- 3D Tablet foundation (taller 5-row for 5 tools + full O± panel) -->
    <a-entity
      id="tablet"
      position="0 1.25 -0.9"
      rotation="-15 0 0"
      geometry="primitive: plane; width: 0.95; height: 1.12"
      material="color: #1a1a44; shader: flat; opacity: 0.92; transparent: true"
      class="raycaster-target"
    >
      <!-- Title & stats placeholders filled by initTabletUI -->
    </a-entity>

    <!-- Environment sky for immersion -->
    <a-sky color="#050510"></a-sky>
  </a-scene>

  <script>
    // Main bootstrap — intelligent, error-hardened, aligned to skill workflow
    (function() {
      'use strict';

      function boot() {
        return window.safeExecute(function() {
          // Seed initial state if needed
          if (window.VRCreatorState) {
            window.updateVRState({ selectedTool: 'cube' });
          }

          // Build the full tablet UI (5 primitives + actions)
          if (typeof window.initTabletUI === 'function') {
            window.initTabletUI();
          }

          // Attach holographic wrist variant (vision-aligned)
          if (typeof window.makeWristHolographic === 'function') {
            window.makeWristHolographic();
          }

          // Auto-load from URL hash if present (share feature)
          if (typeof window.loadSceneFromHash === 'function') {
            window.loadSceneFromHash();
          }

          // Avatar hands polish (semi-transparent 0.55 on model-loaded + timeout for ethereal vision alignment)
          ['#leftHand', '#rightHand'].forEach(function(sel) {
            const hand = document.querySelector(sel);
            if (hand) {
              const applyOpacity = function() {
                if (hand.object3D) {
                  hand.object3D.traverse(function(o) {
                    if (o.isMesh && o.material) {
                      o.material.transparent = true;
                      o.material.opacity = 0.55;
                    }
                  });
                }
              };
              hand.addEventListener('model-loaded', applyOpacity);
              setTimeout(applyOpacity, 1500); // fallback
            }
          });

          console.log('🚀 Quest VR Creator boot complete — all intelligence layers active (incl avatar hands polish).');
        }, 'Main Boot');
      }

      // Wait for scene + A-Frame ready
      const scene = document.querySelector('a-scene');
      if (scene) {
        if (scene.hasLoaded) {
          boot();
        } else {
          scene.addEventListener('loaded', boot);
        }
      } else {
        window.addEventListener('load', boot);
      }

      // Desktop keyboard fallbacks (1-5 spawn, U undo, M mat, S save, L load, E JSON, G GLTF, X share, H holo, D del, Ctrl+C clear, o/Shift+o opacity)
      window.addEventListener('keydown', function(e) {
        window.safeExecute(function() {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const key = e.key.toLowerCase();
          if (key === '1') { window.selectTool && window.selectTool('cube'); window.spawnIntelligentObject && window.spawnIntelligentObject('cube'); }
          else if (key === '2') { window.selectTool && window.selectTool('sphere'); window.spawnIntelligentObject && window.spawnIntelligentObject('sphere'); }
          else if (key === '3') { window.selectTool && window.selectTool('cylinder'); window.spawnIntelligentObject && window.spawnIntelligentObject('cylinder'); }
          else if (key === '4') { window.selectTool && window.selectTool('cone'); window.spawnIntelligentObject && window.spawnIntelligentObject('cone'); }
          else if (key === '5') { window.selectTool && window.selectTool('torus'); window.spawnIntelligentObject && window.spawnIntelligentObject('torus'); }
          else if (key === 'u') { window.undoLastSpawn && window.undoLastSpawn(); }
          else if (key === 'm' && !e.ctrlKey) { window.setMaterialPreset && window.setMaterialPreset(); }
          else if (key === 's' && !e.ctrlKey) { window.saveSceneToStorage && window.saveSceneToStorage(); }
          else if (key === 'l') { window.loadSceneFromStorage && window.loadSceneFromStorage(); }
          else if (key === 'e') { window.exportSceneJSON && window.exportSceneJSON(); }
          else if (key === 'g') { window.exportSceneGLTF && window.exportSceneGLTF(); }
          else if (key === 'x') { window.shareSceneViaHash && window.shareSceneViaHash(); }
          else if (key === 'h') { window.toggleHolographic && window.toggleHolographic(); }
          else if (key === 'o') { window.adjustMaterial && window.adjustMaterial('opacity', e.shiftKey ? -0.1 : 0.1); }
          else if (key === 'd') {
            const state = window.VRCreatorState;
            if (state && state.spawnedObjects && state.spawnedObjects.length) {
              const last = state.spawnedObjects[state.spawnedObjects.length - 1];
              window.deleteSpawnedObject && window.deleteSpawnedObject(last.id);
            }
          }
          else if ((key === 'c' || key === 'с') && e.ctrlKey) {
            e.preventDefault();
            window.clearAllSpawned && window.clearAllSpawned();
          }
        }, 'Keyboard Fallback');
      });

      // Grip-down delete on rightHand (single grip on intersected spawned object)
      // Double-grip (<450ms) for refined delete gesture
      let lastGripTime = 0;
      const rightHand = document.querySelector('#rightHand');
      if (rightHand) {
        rightHand.addEventListener('gripdown', function() {
          window.safeExecute(function() {
            const now = Date.now();
            const isDouble = (now - lastGripTime) < 450;
            lastGripTime = now;

            // Prefer raycaster intersection
            const ray = rightHand.components.raycaster;
            let target = null;
            if (ray && ray.intersectedEls && ray.intersectedEls.length) {
              target = ray.intersectedEls.find(el => el.classList && el.classList.contains('spawned-object'));
            }
            // Fallback: super-hands hovered / grabbed
            if (!target && rightHand.components['super-hands']) {
              // super-hands may track hovered
              const hovered = rightHand.components['super-hands'].hovered;
              if (hovered && hovered.classList && hovered.classList.contains('spawned-object')) {
                target = hovered;
              }
            }

            if (target) {
              if (isDouble) {
                console.log('🗑️ Double-grip delete:', target.id);
              } else {
                console.log('🗑️ Grip-down delete:', target.id);
              }
              if (typeof window.deleteSpawnedObject === 'function') {
                window.deleteSpawnedObject(target);
              }
            }
          }, 'Grip Delete Gesture');
        });
      }

      // Expose a simple status for desktop testing
      console.log('✅ Quest VR Creator index.html loaded — keyboard + grip ready. Open in Quest Browser for full VR.');
    })();
  </script>
</body>
</html>
